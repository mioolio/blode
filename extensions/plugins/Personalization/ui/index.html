<link rel="stylesheet" href="../styles/appearance.css" />
<main>
  <header>
    <h1 data-label="title"></h1>
    <p data-label="subtitle"></p>
  </header>
  <label class="desktop-glass">
    <span class="desktop-glass-copy">
      <strong data-label="desktopGlass"></strong>
      <small data-label="desktopGlassHint"></small>
    </span>
    <span class="desktop-glass-switch">
      <input id="desktop-glass" type="checkbox" role="switch" />
      <i aria-hidden="true"></i>
    </span>
  </label>
  <div id="presets" class="presets"></div>
  <footer><span id="status" role="status"></span><button id="preview" data-label="preview"></button></footer>
</main>
<script type="module" src="../runtime/appearance.mjs"></script>
